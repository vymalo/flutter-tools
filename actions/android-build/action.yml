name: 'Android build (Vymalo)'
description: >-
  Build a signed Android APK + AAB with one step. Decodes the keystore, writes
  android/key.properties, runs `flutter build`, cleans up, and exposes the
  artifact paths as outputs. With no keystore the APK falls back to unsigned
  debug. No Fastlane/Ruby needed — the signing + build logic is in the Dart CLI.

inputs:
  workspace:
    default: ${{ github.workspace }}
  project-dir:
    default: 'mobile'
  artifacts:
    description: 'apk | aab | both'
    default: 'both'
  build-number:
    description: 'Android versionCode (--build-number). Empty = pubspec default.'
    default: ''
  dart-defines:
    description: 'One KEY=VALUE per line → --dart-define for each.'
    default: ''
  flavor:
    description: >-
      Gradle product flavor (flutter build --flavor). Required once the app
      declares productFlavors; the artifact paths follow Flutter's flavored names.
    default: ''
  keystore-base64:
    description: 'base64 of the signing keystore. Empty → unsigned debug APK.'
    default: ''
  keystore-password:
    default: ''
  key-alias:
    default: ''
  key-password:
    default: ''

outputs:
  signed:
    description: 'true when a release-signed build was produced.'
    value: ${{ steps.build.outputs.signed }}
  apk-path:
    description: 'Absolute path to the built APK.'
    value: ${{ steps.build.outputs.apk-path }}
  aab-path:
    description: 'Absolute path to the built AAB (empty when unsigned/skipped).'
    value: ${{ steps.build.outputs.aab-path }}

runs:
  using: composite
  steps:
    - id: install
      shell: bash
      env:
        FT_ACTION_PATH: ${{ github.action_path }}
        FT_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail
        installer="$FT_ACTION_PATH/../../scripts/install-cli.sh"
        if [ -f "$installer" ]; then
          bash "$installer"
        else
          # Podman does not translate the host action path into the container.
          remote_installer="$(mktemp)"
          trap 'rm -f "$remote_installer"' EXIT
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            -o "$remote_installer" \
            "https://raw.githubusercontent.com/vymalo/flutter-tools/${FT_REF}/scripts/install-cli.sh"
          bash "$remote_installer"
        fi

    - id: build
      shell: bash
      env:
        ANDROID_KEYSTORE_BASE64: ${{ inputs.keystore-base64 }}
        ANDROID_KEYSTORE_PASSWORD: ${{ inputs.keystore-password }}
        ANDROID_KEY_ALIAS: ${{ inputs.key-alias }}
        ANDROID_KEY_PASSWORD: ${{ inputs.key-password }}
        INPUT_WORKSPACE: ${{ inputs.workspace }}
        INPUT_PROJECT_DIR: ${{ inputs.project-dir }}
        INPUT_ARTIFACTS: ${{ inputs.artifacts }}
        INPUT_BUILD_NUMBER: ${{ inputs.build-number }}
        INPUT_DART_DEFINES: ${{ inputs.dart-defines }}
        INPUT_FLAVOR: ${{ inputs.flavor }}
      run: |
        set -euo pipefail
        args=(
          android-build
          --workspace "$INPUT_WORKSPACE"
          --project-dir "$INPUT_PROJECT_DIR"
          --artifacts "$INPUT_ARTIFACTS"
        )
        if [ -n "$INPUT_BUILD_NUMBER" ]; then
          args+=(--build-number "$INPUT_BUILD_NUMBER")
        fi
        if [ -n "$INPUT_FLAVOR" ]; then
          args+=(--flavor "$INPUT_FLAVOR")
        fi
        # One --dart-define per non-empty line of the dart-defines input.
        while IFS= read -r line; do
          [ -n "$line" ] && args+=(--dart-define "$line")
        done <<< "$INPUT_DART_DEFINES"

        "${{ steps.install.outputs.cli }}" "${args[@]}"
